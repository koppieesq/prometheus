name: ci
on:
  push: { branches: [main] }
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: shellcheck
        run: shellcheck bin/prm scripts/*.sh images/php/prm-cron
      - name: compose config (stack)
        run: |
          printf 'SITE_NAME=ci\nSITE_DIR=/tmp/ci\n' > /tmp/ci.env
          docker compose --env-file /tmp/ci.env -f stack/compose.yaml config -q
          docker compose --env-file /tmp/ci.env -f stack/compose.yaml -f stack/compose.hardened.yaml config -q
          docker compose --env-file /tmp/ci.env -f stack/compose.static.yaml config -q
          docker compose --env-file /tmp/ci.env -f stack/compose.static.yaml -f stack/compose.static.hardened.yaml config -q
          mkdir -p /tmp/ci/app && touch /tmp/ci/app.env && printf "APP_COMMAND=true\n" >> /tmp/ci.env
          docker compose --env-file /tmp/ci.env -f stack/compose.python.yaml config -q
          docker compose --env-file /tmp/ci.env -f stack/compose.python.yaml -f stack/compose.python.hardened.yaml config -q
      - name: compose config (edge)
        run: ACME_EMAIL=ci@example.com docker compose -f edge/compose.yaml config -q

  smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        hardened: ["0", "1"]
    env:
      PRM_HARDENED: ${{ matrix.hardened }}
    steps:
      - uses: actions/checkout@v6
      - name: create site from the hello example
        run: bin/prm new ci ci.example.com --example hello
      - name: up
        run: bin/prm ci up --wait --wait-timeout 180
      - name: check response
        run: |
          out="$(bin/prm ci exec -T web wget -qO- http://127.0.0.1/)"
          echo "$out"
          echo "$out" | grep -q 'db: ok'
          echo "$out" | grep -q 'files: ok'
      - name: backup and restore round trip
        run: |
          bin/prm ci backup
          PRM_YES=1 bin/prm ci restore "$(ls -1t sites/ci/backups/db-*.sql.gz | head -1)"
      - name: logs on failure
        if: failure()
        run: bin/prm ci logs --tail 100

  static:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        hardened: ["0", "1"]
    env:
      PRM_HARDENED: ${{ matrix.hardened }}
    steps:
      - uses: actions/checkout@v6
      - name: migrate an old HTML site (docroot in a subdirectory, awkward permissions)
        run: |
          mkdir -p /tmp/old/public_html/img
          echo '<h1>old site</h1>' > /tmp/old/public_html/index.htm
          echo 'png' > /tmp/old/public_html/img/a.png
          echo '<?php echo "secret";' > /tmp/old/public_html/form.php
          printf 'secret=1\n' > /tmp/old/public_html/.env
          chmod 600 /tmp/old/public_html/img/a.png
          bin/prm migrate-static old old.example.com --code /tmp/old
      - name: it serves the pages and refuses scripts and dotfiles
        run: |
          get() { bin/prm old exec -T web wget -qO- "http://127.0.0.1$1"; }
          code() { bin/prm old exec -T web wget -S -qO /dev/null "http://127.0.0.1$1" 2>&1 | grep -o 'HTTP/[0-9.]* [0-9]*' | tail -n1 | cut -d' ' -f2; }
          get / | grep -q 'old site'
          get /img/a.png | grep -q png
          [ "$(code /form.php)" = 403 ]
          [ "$(code /.env)" = 403 ]
          [ "$(code /nope)" = 404 ]
      - name: only nginx runs
        run: |
          [ "$(docker ps -q --filter label=com.docker.compose.project=old | wc -l)" = 1 ]
      - name: backup
        run: |
          bin/prm old backup
          ls sites/old/backups/app-*.tar.gz
      - name: logs on failure
        if: failure()
        run: bin/prm old logs --tail 100

  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        hardened: ["0", "1"]
    env:
      PRM_HARDENED: ${{ matrix.hardened }}
    steps:
      - uses: actions/checkout@v6
      - name: create a python site from the example
        run: |
          bin/prm new py py.example.com --type python --example python --command "python main.py"
          echo EXAMPLE_SECRET=hunter2 > sites/py/app.env
      - name: up
        run: bin/prm py up --wait --wait-timeout 180
      - name: the app runs with its packages, data dir and environment
        run: |
          out="$(bin/prm py exec -T app python -c "import urllib.request as u; print(u.urlopen('http://127.0.0.1:8000/x').read().decode())")"
          echo "$out"
          echo "$out" | grep -q 'python: ok'
          echo "$out" | grep -q 'deps: ok'
          echo "$out" | grep -q 'data: ok'
          echo "$out" | grep -q 'secret: set'
      - name: the code is read-only and a one-off command can write data
        run: |
          if bin/prm py exec -T app sh -c 'touch /app/should-fail' 2>/dev/null; then echo "app/ is writable"; exit 1; fi
          bin/prm py run python -c "open('/data/touched', 'w').write('x')"
          test -f sites/py/data/touched
      - name: only the app runs
        run: '[ "$(docker ps -q --filter label=com.docker.compose.project=py | wc -l)" = 1 ]'
      - name: backup
        run: |
          bin/prm py backup
          tar -tzf sites/py/backups/data-*.tar.gz | grep -q touched
      - name: a route puts the app under another site's hostname, and the edge config is valid
        run: |
          bin/prm new host host.example.com --type static --example static
          bin/prm route py /chat --on host
          grep -q 'reverse_proxy py-web:8000' edge/sites/host.d/py.caddy
          docker run --rm -e ACME_EMAIL=ci@example.com \
            -v "$PWD/edge/Caddyfile:/etc/caddy/Caddyfile:ro" -v "$PWD/edge/sites:/etc/caddy/sites:ro" \
            caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile
      - name: logs on failure
        if: failure()
        run: bin/prm py logs --tail 100
