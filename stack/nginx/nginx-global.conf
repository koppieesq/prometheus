# http-level settings shared by every app type. (TLS + compression live at the edge.)
server_tokens off;

# Re-resolve container names at request time so `php`/`ws` can be recreated
# without leaving nginx pointing at a stale IP.
resolver 127.0.0.11 valid=5s ipv6=off;

# Real client IP from the edge proxy (private ranges only).
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# TLS terminates at the edge; tell the app.
map $http_x_forwarded_proto $prm_https {
	default off;
	https   on;
}

map $http_upgrade $connection_upgrade {
	default upgrade;
	''      close;
}

# --- anonymous microcache ----------------------------------------------------
# Cache GET/HEAD for a few seconds, but never for sessions or auth'd requests.
fastcgi_cache_path /var/cache/nginx/micro levels=1:2 keys_zone=micro:10m max_size=48m inactive=60s use_temp_path=off;

map $request_method $prm_skip_method {
	default 1;
	GET     0;
	HEAD    0;
}
map $http_cookie $prm_skip_cookie {
	default 0;
	~*(SESS|SSESS|PHPSESSID|laravel_session|wordpress_logged_in|comment_author) 1;
}
map $http_authorization $prm_skip_auth {
	default 1;
	''      0;
}
map "$prm_skip_method$prm_skip_cookie$prm_skip_auth" $prm_skip_cache {
	default 1;
	"000"   0;
}
